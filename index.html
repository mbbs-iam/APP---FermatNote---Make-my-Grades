<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="description" content="Fermat Note - Hub de Classe · Devoirs, Forum, Chat et Notices pour les élèves." />
  <meta name="theme-color" content="#e7fff3" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fermat Note" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icon-192x192.png" />

  <title>Fermat Note</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="design-tokens.css" />
  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
</head>

<body>
  <div id="app">
    <header class="app-header" id="app-header">
      <div class="header-content">
        <div class="header-title">
          <h1>Fermat Note</h1>
        </div>
        <button class="header-menu-btn" aria-label="Menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
      </div>
    </header>

    <main id="main-content" role="main">
      <section id="section-devoirs" class="section" role="region" aria-label="Devoirs à faire" style="display:none">
        <div class="page-header">
          <div class="page-header__text">
            <h2>Devoirs</h2>
            <p>Reste à jour sur tes cours</p>
          </div>
        </div>

        <div class="section-toggle" role="group" aria-label="Vue">
          <button id="toggle-devoirs" class="section-toggle__btn section-toggle__btn--active">
            <span class="material-symbols-outlined">assignment</span>
            Devoirs
          </button>
          <button id="toggle-evaluations" class="section-toggle__btn">
            <span class="material-symbols-outlined">quiz</span>
            Évaluations
          </button>
        </div>

        <div class="devoirs-stats" id="devoirs-stats-block">
          <span id="devoirs-stats-done">0</span>
          <span>/</span>
          <span id="devoirs-stats-total">0</span>
        </div>

        <div class="filter-bar" id="devoirs-filter-bar" role="toolbar" aria-label="Filtrer les devoirs">
          <button class="filter-btn filter-btn--active devoir-filter-btn" data-filter="tous">
            <span class="material-symbols-outlined">list</span> Tous
          </button>
          <button class="filter-btn filter-btn--inactive devoir-filter-btn" data-filter="en-cours">
            <span class="material-symbols-outlined">pending</span> En cours
          </button>
          <button class="filter-btn filter-btn--inactive devoir-filter-btn" data-filter="faits">
            <span class="material-symbols-outlined">assignment_turned_in</span> Faits
          </button>
        </div>

        <div id="devoirs-feed" role="list" aria-label="Liste des devoirs" aria-live="polite"></div>
        <div id="evaluations-feed" role="list" aria-label="Évaluations à venir" aria-live="polite" style="display:none"></div>

        <button id="fab-new-devoir" aria-label="Ajouter un devoir" title="Nouveau devoir" class="fab">
          <span class="material-symbols-outlined">add_task</span>
        </button>

        <div id="modal-new-devoir" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-devoir-title">
          <div class="modal">
            <div class="modal__handle" aria-hidden="true"></div>
            <h2 class="modal__title" id="modal-devoir-title">Ajouter un devoir</h2>

            <div class="form-group">
              <label class="form-label" for="devoir-matiere">Matière</label>
              <select class="form-select" id="devoir-matiere">
                <option value="Mathématiques">Mathématiques</option>
                <option value="Physique-Chimie">Physique-Chimie</option>
                <option value="SVT">SVT</option>
                <option value="SES">SES</option>
                <option value="Histoire-Géo / HGGSP">Histoire-Géo / HGGSP</option>
                <option value="Français / Philo / HLP">Français / Philo / HLP</option>
                <option value="Anglais (LV1)">Anglais (LV1)</option>
                <option value="NSI">NSI</option>
                <option value="Sciences de l'Ingénieur">Sciences de l'Ingénieur</option>
                <option value="Espagnol / Allemand (LV2)">Espagnol / Allemand (LV2)</option>
                <option value="Arts / Littérature">Arts / Littérature</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="devoir-titre">Titre du devoir <span style="color:var(--color-error);">*</span></label>
              <input class="form-input" type="text" id="devoir-titre" placeholder="Ex : Exercices 4 et 5 page 245" maxlength="100" autocomplete="off" />
            </div>

            <div class="form-group">
              <label class="form-label" for="devoir-date">Date limite</label>
              <input class="form-input" type="date" id="devoir-date" />
            </div>

            <div class="form-group">
              <label class="form-label">Image du sujet (optionnel)</label>
              <button id="devoir-attach-btn" type="button" class="button button--cancel" style="margin-bottom: 0.5rem;">
                <span class="material-symbols-outlined">add_photo_alternate</span> Joindre une photo
              </button>
              <input type="file" id="devoir-file-input" accept="image/*" style="display: none;" aria-hidden="true" />
              <div id="devoir-image-preview-wrap" style="display:none;">
                <img id="devoir-preview-img" src="" alt="Aperçu" style="max-width: 100%; border-radius: var(--radius-lg);" />
              </div>
            </div>

            <div class="modal__actions">
              <button id="devoir-cancel-btn" class="button button--cancel">Annuler</button>
              <button id="devoir-submit-btn" class="button button--primary">Ajouter</button>
            </div>
          </div>
        </div>

        <div style="height: 130px; flex-shrink: 0; width: 100%;"></div>
      </section>

      <section id="section-forum" class="section" role="region" aria-label="Forum" style="display:none">
        <div class="page-header">
          <div class="page-header__text">
            <h2>Forum</h2>
            <p>Posez vos questions et partagez vos connaissances</p>
          </div>
        </div>

        <div class="filter-bar" role="toolbar" aria-label="Trier les messages">
          <button class="filter-btn filter-btn--active forum-sort-btn" data-sort="recent">
            <span class="material-symbols-outlined">schedule</span> Récents
          </button>
          <button class="filter-btn filter-btn--inactive forum-sort-btn" data-sort="popular">
            <span class="material-symbols-outlined">trending_up</span> Populaires
          </button>
        </div>

        <div id="forum-feed" role="list" aria-label="Messages du forum" aria-live="polite"></div>

        <button id="fab-new-post" aria-label="Nouveau message" title="Nouveau message" class="fab">
          <span class="material-symbols-outlined">add</span>
        </button>

        <div id="modal-new-post" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-post-title">
          <div class="modal">
            <div class="modal__handle" aria-hidden="true"></div>
            <h2 class="modal__title" id="modal-post-title">Nouvelle question</h2>

            <div class="form-group">
              <label class="form-label" for="forum-title">Titre <span style="color:var(--color-error);">*</span></label>
              <input class="form-input" type="text" id="forum-title" placeholder="Quel est votre question ?" maxlength="150" />
            </div>

            <div class="form-group">
              <label class="form-label" for="forum-body">Description <span style="color:var(--color-error);">*</span></label>
              <textarea class="form-input" id="forum-body" placeholder="Décrivez votre question en détail..." rows="5" maxlength="5000"></textarea>
            </div>

            <div class="form-group">
              <label class="form-label">Image (optionnelle)</label>
              <button id="forum-attach-btn" type="button" class="button button--cancel">
                <span class="material-symbols-outlined">add_photo_alternate</span> Joindre une image
              </button>
              <input type="file" id="forum-file-input" accept="image/*" style="display: none;" aria-hidden="true" />
              <div id="forum-image-preview-wrap" style="display:none;">
                <img id="forum-preview-img" src="" alt="Aperçu" style="max-width: 100%; border-radius: var(--radius-lg);" />
              </div>
            </div>

            <div class="modal__actions">
              <button id="forum-cancel-btn" class="button button--cancel">Annuler</button>
              <button id="forum-submit-btn" class="button button--primary">Publier</button>
            </div>
          </div>
        </div>

        <div id="modal-forum-replies" class="modal-backdrop" role="dialog" aria-modal="true">
          <div class="modal" style="max-width: 600px;">
            <div class="modal__handle" aria-hidden="true"></div>
            <h2 class="modal__title" id="modal-replies-title"></h2>

            <div class="forum-replies-list" style="max-height: 400px; overflow-y: auto; margin-bottom: 1rem;"></div>

            <div class="modal__actions">
              <button id="forum-close-replies-btn" class="button button--cancel">Fermer</button>
            </div>
          </div>
        </div>

        <div style="height: 130px; flex-shrink: 0; width: 100%;"></div>
      </section>

      <section id="section-chat" class="section" role="region" aria-label="Chat" style="display:none">
        <div class="page-header">
          <div class="page-header__text">
            <h2>Chat</h2>
            <p>Discutez en temps réel</p>
          </div>
        </div>

        <div id="chat-message-list" role="list" aria-label="Messages du chat" aria-live="polite" class="chat-message-list"></div>

        <div class="chat-reply-preview" id="chat-reply-preview">
          <span class="chat-reply-preview__icon material-symbols-outlined">reply</span>
          <div class="chat-reply-preview__body">
            <span class="chat-reply-preview__author" id="chat-reply-author"></span>
            <span class="chat-reply-preview__snippet" id="chat-reply-snippet"></span>
          </div>
          <button class="chat-reply-preview__cancel" id="chat-reply-preview-cancel" aria-label="Annuler la réponse">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>

        <div class="chat-input-area">
          <input type="text" id="chat-input" class="chat-input" placeholder="Écrivez un message..." autocomplete="off" />
          <button id="chat-send-btn" class="chat-send-btn" aria-label="Envoyer">
            <span class="material-symbols-outlined">send</span>
          </button>
        </div>

        <div style="height: 20px; flex-shrink: 0; width: 100%;"></div>
      </section>

      <section id="section-profil" class="section" role="region" aria-label="Mon profil" style="display:none">
        <div class="page-header">
          <div class="page-header__text">
            <h2>Mon Profil</h2>
            <p>Gérez votre compte et vos paramètres</p>
          </div>
        </div>

        <div id="profil-content" style="padding: 1rem;"></div>

        <div style="height: 130px; flex-shrink: 0; width: 100%;"></div>
      </section>
    </main>

    <nav class="app-nav" role="navigation" aria-label="Navigation principale">
      <button class="nav-tab active" id="tab-devoirs" onclick="navigateTo('devoirs')">
        <span class="nav-tab__icon material-symbols-outlined">assignment</span>
        <span class="nav-tab__label">Devoirs</span>
      </button>
      <button class="nav-tab" id="tab-forum" onclick="navigateTo('forum')">
        <span class="nav-tab__icon material-symbols-outlined">forum</span>
        <span class="nav-tab__label">Forum</span>
      </button>
      <button class="nav-tab" id="tab-chat" onclick="navigateTo('chat')">
        <span class="nav-tab__icon material-symbols-outlined">mail</span>
        <span class="nav-tab__label">Chat</span>
      </button>
      <button class="nav-tab" id="tab-profil" onclick="navigateTo('profil')">
        <span class="nav-tab__icon material-symbols-outlined">person</span>
        <span class="nav-tab__label">Profil</span>
      </button>
    </nav>

    <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script type="module">
    import { initChat, destroyChat } from './chat.js';
    import { initForum, destroyForum } from './forum.js';

    let currentSection = 'devoirs';

    window.navigateTo = function(section) {
      if (currentSection === section) return;

      document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
      document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));

      const sectionEl = document.getElementById(`section-${section}`);
      if (sectionEl) sectionEl.style.display = 'block';

      const navBtn = document.getElementById(`tab-${section}`);
      if (navBtn) navBtn.classList.add('active');

      if (section === 'chat' && currentSection !== 'chat') {
        initChat();
      } else if (currentSection === 'chat' && section !== 'chat') {
        destroyChat();
      }

      if (section === 'forum' && currentSection !== 'forum') {
        initForum();
      } else if (currentSection === 'forum' && section !== 'forum') {
        destroyForum();
      }

      currentSection = section;
    };

    document.addEventListener('DOMContentLoaded', () => {
      navigateTo('devoirs');

      const header = document.getElementById('app-header');
      let prev = 0;
      let ticking = false;

      document.querySelector('.section').addEventListener('scroll', function() {
        if (!ticking) {
          requestAnimationFrame(() => {
            const cur = this.scrollTop;
            const delta = Math.abs(cur - prev);
            
            if (delta > 15) {
              if (cur > prev && cur > 50) {
                header.classList.add('header--hidden');
              } else {
                header.classList.remove('header--hidden');
              }
              prev = Math.max(0, cur);
            }
            ticking = false;
          });
          ticking = true;
        }
      }, { passive: true });
    });
  </script>
</body>

</html>
