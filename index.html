        sec.addEventListener("scroll", function () {
          if (!ticking) {
            requestAnimationFrame(function () {
              const cur = sec.scrollTop;
              const delta = Math.abs(cur - prev);
              if (delta > 15) {
                if (cur > prev && cur > 50) {
                  hdr.classList.add("header--hidden");
                } else {
                  hdr.classList.remove("header--hidden");
                }
                prev = Math.max(0, cur);
              }
              ticking = false;
            });
            ticking = true;
          }
        }, { passive: true });
      });
    })();
